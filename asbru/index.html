<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aras</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Courier New',monospace; }

        .custom-cursor {
            position:fixed; width:40px; height:40px;
            background:url('assets/custom_cursor.png') no-repeat center center;
            background-size:contain; pointer-events:none; z-index:9999;
            transform:translate(-50%,-50%);
        }
        body:not(.touch-device) { cursor:none; }
        body { background:#000; color:#fff; overflow:hidden; }
        .container { width:100%; height:100vh; position:relative; }

        #background {
            position:fixed; top:0; left:0; width:100%; height:100%;
            object-fit:cover; z-index:1; pointer-events:none;
        }
        .glitch-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            pointer-events:none; z-index:2; opacity:0; transition:opacity 0.5s;
        }
        .hidden { display:none !important; }

        /* ── Profile block ── */
        #profile-block {
            position:fixed; top:50%; left:50%;
            transform:translate(-50%,-50%);
            width:820px; min-height:260px;
            background:rgba(0,0,0,0.7);
            border:1px solid rgba(0,195,255,0.5);
            padding:24px; border-radius:15px; z-index:20;
            display:flex; flex-direction:column; gap:15px;
            backdrop-filter:blur(10px); opacity:0;
            transform-style:preserve-3d;
            transition:transform 0.5s ease-out;
        }
        .profile-header { display:flex; align-items:flex-start; gap:20px; }

        .profile-container { position:relative; width:130px; height:130px; flex-shrink:0; }
        .profile-container::after {
            content:''; position:absolute; top:-3px; left:-3px; right:-3px; bottom:-3px;
            border-radius:50%;
            background:radial-gradient(circle at 10px 10px, #00CED1 10%, transparent 15%);
            animation:orbit 3s linear infinite; z-index:-1; filter:blur(1px);
        }
        .profile-container.fast-orbit::after { animation:fast-orbit 0.5s linear forwards; }
        .profile-picture { width:130px; height:130px; border-radius:50%; object-fit:cover; cursor:pointer; }

        .profile-info { flex:1; display:flex; flex-direction:column; }
        .name-stack { display:flex; flex-direction:column; gap:3px; margin-bottom:12px; }

        @font-face {
            font-family:'Angel Wish';
            src:url('assets/Angel_wish.ttf') format('truetype');
        }
        #profile-name {
            font-family:'Angel Wish','Courier New',monospace;
            font-size:32px; font-weight:bold; letter-spacing:3px; color:#fff;
            filter:drop-shadow(0 0 8px rgba(255,255,255,0.7));
        }
        #profile-username { font-size:13px; color:rgba(255,255,255,0.45); letter-spacing:1px; }
        #profile-bio { color:rgba(255,255,255,0.8); font-size:16px; line-height:1.6; }

        .bio-separator { width:100%; height:1px; background:rgba(255,255,255,0.15); margin:5px 0; }

        .profile-footer { display:flex; flex-direction:column; gap:8px; width:100%; }
        .social-links { display:flex; justify-content:center; gap:14px; }
        .social-icon {
            width:38px; height:38px;
            transition:transform 0.3s ease;
            filter:drop-shadow(0 0 8px rgba(255,255,255,0.5));
        }
        .social-icon:hover { transform:scale(1.4) rotateY(15deg); }

        .visitor-counter {
            display:flex; align-items:center; gap:8px;
            background:rgba(255,255,255,0.1); padding:8px 15px;
            border-radius:20px; font-size:14px; align-self:flex-start; position:relative;
        }
        .visitor-icon { width:18px; height:18px; color:white; }
        .visitor-counter .tooltip {
            visibility:hidden; width:120px; background:rgba(0,0,0,0.8);
            color:#fff; text-align:center; border-radius:6px; padding:5px 0;
            position:absolute; top:-35px; left:50%; margin-left:-60px;
            opacity:0; transition:opacity 0.3s; z-index:100;
        }
        .visitor-counter:hover .tooltip { visibility:visible; opacity:1; }

        /* ── Bottom controls ── */
        .bottom-controls {
            position:fixed; bottom:calc(50% - 200px - 10px); left:50%;
            transform:translateX(-50%);
            display:flex; align-items:center; gap:15px; z-index:20;
            background:rgba(0,0,0,0.7); padding:8px 14px;
            border-radius:20px; backdrop-filter:blur(5px);
        }
        .volume-control, .transparency-control { display:flex; align-items:center; gap:8px; }
        .volume-icon, .transparency-icon { width:20px; height:20px; cursor:pointer; color:white; }
        .slider {
            -webkit-appearance:none; appearance:none;
            width:80px; height:5px; border-radius:5px;
            background:rgba(255,255,255,0.3); outline:none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance:none; appearance:none;
            width:12px; height:12px; border-radius:50%; background:white; cursor:pointer;
        }

        /* ── Start screen ── */
        #start-screen {
            position:fixed; top:0; left:0; width:100%; height:100vh;
            background:rgba(0,0,0,0.9); backdrop-filter:blur(10px);
            display:flex; align-items:center; justify-content:center;
            z-index:30; cursor:pointer;
        }
        #start-text { font-size:24px; color:#fff; text-align:center; }

        /* ── Animations ── */
        .glitch { animation:glitch 0.2s ease-in-out; }
        @keyframes glitch {
            0%,100% { transform:translate(0); }
            20% { transform:translate(-2px,2px); }
            40% { transform:translate(-2px,-2px); }
            60% { transform:translate(2px,2px); }
            80% { transform:translate(2px,-2px); }
        }
        @keyframes orbit { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        @keyframes fast-orbit { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

        /* ── Mobile ── */
        @media (max-width:860px) {
            #profile-block { width:92vw; max-width:420px; padding:16px; min-height:unset; }
            .profile-header { flex-direction:column; align-items:center; gap:12px; }
            .profile-info { align-items:center; text-align:center; }
            .name-stack { align-items:center; }
            #profile-name { font-size:26px; }
            #profile-bio  { font-size:14px; }
            .social-links { gap:10px; }
            .social-icon  { width:32px; height:32px; }
            .visitor-counter { align-self:center; font-size:12px; }
            .bottom-controls { bottom:20px; gap:10px; padding:6px 12px; }
            .slider { width:60px; }
            #start-text { font-size:18px; padding:0 20px; }
        }
    </style>
</head>
<body onload="initMedia()">
    <div class="custom-cursor"></div>

    <div id="start-screen">
        <div id="start-text"></div>
    </div>

    <div class="container">
        <video id="background" autoplay loop playsinline webkit-playsinline>
            <source src="assets/background.mp4" type="video/mp4">
        </video>
        <div class="glitch-overlay"></div>

        <div id="profile-block">
            <div class="profile-header">
                <div class="profile-container">
                    <img src="assets/profile.png" alt="Profile" class="profile-picture">
                </div>
                <div class="profile-info">
                    <div class="name-stack">
                        <div id="profile-name">aras</div>
                        <div id="profile-username">@_asbru_</div>
                    </div>
                    <div id="profile-bio"></div>
                </div>
            </div>

            <div class="bio-separator"></div>

            <div class="profile-footer">
                <div class="social-links">
                    <a href="https://discord.com/users/1120335112748413038" target="_blank">
                        <img src="assets/discord.png" alt="Discord" class="social-icon">
                    </a>
                    <a href="https://www.tiktok.com/@aras_rjv" target="_blank">
                        <img src="assets/tiktok.png" alt="TikTok" class="social-icon">
                    </a>
                    <a href="https://www.instagram.com/aras_asbru" target="_blank">
                        <img src="assets/instagram.png" alt="Instagram" class="social-icon">
                    </a>
                </div>
                <div class="visitor-counter">
                    <svg class="visitor-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                    <span id="visitor-count">0</span>
                    <span class="tooltip">Profile Views</span>
                </div>
            </div>
        </div>

        <div class="bottom-controls">
            <div class="volume-control">
                <svg id="volume-icon" class="volume-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                </svg>
                <input id="volume-slider" class="slider" type="range" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="transparency-control">
                <svg class="transparency-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
                <input id="transparency-slider" class="slider" type="range" min="0" max="1" step="0.01" value="0.7">
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
    function initMedia() {
        const v = document.getElementById('background');
        v.volume = 0.5;
        v.muted = false;
        v.play().catch(() => { v.muted = true; v.play(); });
    }

    document.addEventListener('DOMContentLoaded', () => {
        const startScreen        = document.getElementById('start-screen');
        const startText          = document.getElementById('start-text');
        const profileName        = document.getElementById('profile-name');
        const profileBio         = document.getElementById('profile-bio');
        const visitorCount       = document.getElementById('visitor-count');
        const volumeIcon         = document.getElementById('volume-icon');
        const volumeSlider       = document.getElementById('volume-slider');
        const transparencySlider = document.getElementById('transparency-slider');
        const video              = document.getElementById('background');
        const profileBlock       = document.getElementById('profile-block');
        const profilePicture     = document.querySelector('.profile-picture');
        const profileContainer   = document.querySelector('.profile-container');
        const glitchOverlay      = document.querySelector('.glitch-overlay');
        const cursor             = document.querySelector('.custom-cursor');

        // Cursor
        const isTouch = window.matchMedia("(pointer: coarse)").matches;
        if (isTouch) {
            document.body.classList.add('touch-device');
            document.addEventListener('touchmove', e => {
                cursor.style.left = e.touches[0].clientX + 'px';
                cursor.style.top  = e.touches[0].clientY + 'px';
            });
        } else {
            document.addEventListener('mousemove', e => {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top  = e.clientY + 'px';
            });
            document.addEventListener('mousedown', () => cursor.style.transform = 'scale(0.8) translate(-50%,-50%)');
            document.addEventListener('mouseup',   () => cursor.style.transform = 'scale(1) translate(-50%,-50%)');
        }

        // Start typewriter
        const msg = "click to enter";
        let si = 0, sc = '', cOn = true;
        function typeStart() {
            if (si < msg.length) { sc = msg.slice(0, ++si); }
            startText.textContent = sc + (cOn ? '|' : ' ');
            setTimeout(typeStart, 100);
        }
        setInterval(() => { cOn = !cOn; startText.textContent = sc + (cOn ? '|' : ' '); }, 500);
        typeStart();

        // Visitor counter
        let total = parseInt(localStorage.getItem('totalVisitors') || '9999');
        if (!localStorage.getItem('hasVisited')) {
            total++;
            localStorage.setItem('totalVisitors', total);
            localStorage.setItem('hasVisited', 'true');
        }
        visitorCount.textContent = total.toLocaleString();

        // Enter
        function enter() {
            startScreen.classList.add('hidden');
            video.muted = false;
            video.volume = parseFloat(volumeSlider.value);
            video.play().catch(() => { video.muted = true; video.play(); });
            gsap.fromTo(profileBlock, { opacity:0, y:-50 }, { opacity:1, y:0, duration:1, ease:'power2.out' });
            typeWriterName();
            typeWriterBio();
        }
        startScreen.addEventListener('click', enter);
        startScreen.addEventListener('touchstart', e => { e.preventDefault(); enter(); });

        // Name typewriter
        const name = "aras";
        let nt='', ni=0, nDel=false, nCur=true;
        function typeWriterName() {
            if (!nDel && ni < name.length)  { nt = name.slice(0, ++ni); }
            else if (nDel && ni > 0)        { nt = name.slice(0, --ni); }
            else if (ni === name.length)    { nDel = true; setTimeout(typeWriterName, 8000); return; }
            else if (ni === 0)              { nDel = false; }
            profileName.textContent = nt + (nCur ? '|' : ' ');
            if (Math.random() < 0.1) { profileName.classList.add('glitch'); setTimeout(() => profileName.classList.remove('glitch'), 200); }
            setTimeout(typeWriterName, nDel ? 150 : 300);
        }
        setInterval(() => { nCur = !nCur; profileName.textContent = nt + (nCur ? '|' : ' '); }, 500);

        // Bio typewriter
        const bios = ["hat bisschen gedauert aber hat sich auch gelohnt", "\"Hello, World!\""];
        let bt='', bi=0, bmi=0, bDel=false, bCur=true;
        function typeWriterBio() {
            const cur = bios[bmi];
            if (!bDel && bi < cur.length)      { bt = cur.slice(0, ++bi); }
            else if (bDel && bi > 0)           { bt = cur.slice(0, --bi); }
            else if (bi === cur.length)        { bDel = true; setTimeout(typeWriterBio, 2500); return; }
            else if (bi === 0 && bDel)         { bDel = false; bmi = (bmi + 1) % bios.length; }
            profileBio.textContent = bt + (bCur ? '|' : ' ');
            if (Math.random() < 0.08) { profileBio.classList.add('glitch'); setTimeout(() => profileBio.classList.remove('glitch'), 200); }
            setTimeout(typeWriterBio, bDel ? 60 : 120);
        }
        setInterval(() => { bCur = !bCur; profileBio.textContent = bt + (bCur ? '|' : ' '); }, 500);

        // Volume
        let muted = false;
        volumeIcon.addEventListener('click', () => {
            muted = !muted;
            video.muted = muted;
            volumeIcon.innerHTML = muted
                ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>`
                : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>`;
        });
        volumeSlider.addEventListener('input', () => { video.volume = volumeSlider.value; video.muted = muted = false; });

        // Transparency
        transparencySlider.addEventListener('input', () => {
            const v2 = transparencySlider.value;
            profileBlock.style.background = `rgba(0,0,0,${v2})`;
            profileBlock.style.backdropFilter = v2 > 0 ? `blur(${10 * v2}px)` : 'none';
        });

        // Tilt
        function tilt(e, el) {
            const r = el.getBoundingClientRect();
            const px = (e.touches ? e.touches[0].clientX : e.clientX) - (r.left + r.width/2);
            const py = (e.touches ? e.touches[0].clientY : e.clientY) - (r.top + r.height/2);
            gsap.to(el, { rotationX:(py/r.height)*15, rotationY:-(px/r.width)*15, duration:0.3, ease:'power2.out', transformPerspective:1000 });
        }
        profileBlock.addEventListener('mousemove', e => tilt(e, profileBlock));
        profileBlock.addEventListener('mouseleave', () => gsap.to(profileBlock, { rotationX:0, rotationY:0, duration:0.5 }));

        // Profile pic click spin
        profilePicture.addEventListener('click', () => {
            profileContainer.classList.remove('fast-orbit','orbit');
            void profileContainer.offsetWidth;
            profileContainer.classList.add('fast-orbit');
            setTimeout(() => { profileContainer.classList.remove('fast-orbit'); void profileContainer.offsetWidth; profileContainer.classList.add('orbit'); }, 500);
        });

        // Glitch on hover
        profilePicture.addEventListener('mouseenter', () => {
            glitchOverlay.style.opacity = '1';
            setTimeout(() => glitchOverlay.style.opacity = '0', 500);
        });
    });
    </script>
</body>
</html>
