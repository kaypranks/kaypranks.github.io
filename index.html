<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>osintclaw</title>

<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #000;
    color: #fff;
    font-family: "Pixelify Sans", monospace;
    display: flex;
    flex-direction: column;
}

main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
}

.hero {
    width: 100%;
    max-width: 1100px;
    text-align: center;
}

.logo {
    width: 320px;
    max-width: 85%;
    height: auto;
    margin-bottom: 70px;
    image-rendering: pixelated;
    display: block;
    margin-left: auto;
    margin-right: auto;
}

.subtitle {
    color: #777;
    font-size: 18px;
    margin-bottom: 40px;
}

.search-container {
    display: flex;
    gap: 5px;
    width: 100%;
}

select,
input,
button {
    height: 55px;
    background: #000;
    color: #fff;
    border: 1px solid #333;
    font-family: "Pixelify Sans", monospace;
    font-size: 16px;
}

select {
    width: 220px;
    padding: 0 15px;
}

input {
    flex: 1;
    padding: 0 20px;
}

input::placeholder {
    color: #555;
}

button {
    width: 220px;
    cursor: pointer;
    font-size: 18px;
}

select:hover,
input:hover,
button:hover {
    border-color: #777;
}

select:focus,
input:focus,
button:focus {
    outline: none;
    border-color: #fff;
}

button:hover {
    background: #111;
}

.disclaimer {
    text-align: center;
    padding: 30px 20px;
    color: #555;
    font-size: 13px;
    border-top: 1px solid #1c1c1c;
}

@media(max-width:800px){

    .search-container {
        flex-direction: column;
    }

    select,
    input,
    button {
        width: 100%;
    }

}

</style>

</head>


<body>

<main>

<section class="hero">

<img
src="https://kaypranks.github.io/osintclaw-logo.png"
alt="osintclaw logo"
class="logo"
>


<p class="subtitle">
search public intelligence
</p>


<div class="search-container">

<select>

<option>username</option>
<option>email</option>
<option>domain</option>
<option>ip address</option>
<option>phone number</option>
<option>hash</option>
<option>cryptocurrency address</option>
<option>url</option>

</select>


<input
type="text"
placeholder="input search query..."
>


<button>
search
</button>


</div>

</section>

</main>


<footer class="disclaimer">

osintclaw only searches publicly available information from legal sources.
<br>
users are responsible for complying with local laws and platform terms of service.

</footer>


</body>
</html>
