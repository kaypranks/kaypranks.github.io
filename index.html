<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>inhumanintelligence's rng tracker :)</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0a0a;color:#d8d8d8;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}

#loader{position:fixed;inset:0;background:#0a0a0a;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s;}
#loader.gone{opacity:0;pointer-events:none;}
.spinner{width:28px;height:28px;border:2px solid #1e1e1e;border-top-color:#444;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loader-txt{font-size:.7rem;font-weight:700;color:#333;text-transform:uppercase;letter-spacing:.1em;}

.page{max-width:860px;margin:0 auto;padding:56px 28px 96px;}

.header{display:flex;align-items:center;gap:22px;margin-bottom:48px;padding-bottom:36px;border-bottom:1px solid #181818;}
.avatar{width:68px;height:68px;border-radius:50%;object-fit:cover;background:#141414;flex-shrink:0;border:2px solid #1e1e1e;}
.name{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:800;letter-spacing:-.01em;color:#fff;line-height:1;text-transform:uppercase;}
.header-meta{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap;}
.pill{display:inline-flex;align-items:center;gap:6px;background:#131313;border:1px solid #1e1e1e;border-radius:6px;padding:5px 12px;font-size:.72rem;font-weight:600;color:#555;}
.pill b{color:#bbb;font-weight:700;}
.live-tag{display:inline-flex;align-items:center;gap:5px;font-size:.65rem;font-weight:700;color:#333;text-transform:uppercase;letter-spacing:.08em;}
.live-dot{width:6px;height:6px;border-radius:50%;background:#2a2a2a;}
.live-dot.on{background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.35);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:48px;}
.stat-card{background:#111;border:1px solid #1a1a1a;border-radius:14px;padding:22px 24px;}
.stat-label{font-size:.65rem;font-weight:700;color:#383838;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;}
.stat-value{font-family:'Barlow Condensed',sans-serif;font-size:3rem;font-weight:800;color:#fff;line-height:1;letter-spacing:-.01em;}

.best-card{background:#111;border:1px solid #1a1a1a;border-radius:14px;padding:26px 28px;margin-bottom:48px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.best-eyebrow{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#383838;margin-bottom:10px;}
.best-name{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:800;color:#fff;line-height:1;text-transform:uppercase;margin-bottom:5px;}
.best-odds{font-family:'JetBrains Mono',monospace;font-size:.75rem;font-weight:700;color:#444;}
.best-right{text-align:right;flex-shrink:0;}
.best-time-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#2e2e2e;margin-bottom:4px;}
.best-time-val{font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:700;color:#444;}

.sec{margin-bottom:48px;}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.sec-title{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#383838;}
.sec-badge{font-family:'JetBrains Mono',monospace;font-size:.65rem;font-weight:700;color:#2e2e2e;}

.roll-list{display:flex;flex-direction:column;gap:2px;}
.roll-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:9px;transition:background .15s;}
.roll-row:hover{background:#111;}
.roll-row.hl{background:#121212;}
.roll-row.hl:hover{background:#151515;}
.rn{font-size:.84rem;font-weight:600;color:#484848;flex:1;}
.roll-row.hl .rn{color:#c8c8c8;font-weight:700;}
.ro{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;color:#252525;}
.roll-row.hl .ro{color:#383838;}
.rt{font-family:'JetBrains Mono',monospace;font-size:.63rem;font-weight:500;color:#222;min-width:38px;text-align:right;}
.roll-row.hl .rt{color:#363636;}

.aura-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px;}
.aura-card{background:#111;border:1px solid #1a1a1a;border-radius:12px;padding:18px 14px 14px;position:relative;transition:border-color .15s,transform .2s;cursor:default;}
.aura-card:hover{border-color:#252525;transform:translateY(-2px);}
.aura-card.rare{border-color:#202020;background:#121212;}
.aura-name{font-size:.84rem;font-weight:700;color:#aaa;line-height:1.3;word-break:break-word;margin-bottom:5px;}
.aura-card.rare .aura-name{color:#ddd;}
.aura-odds{font-family:'JetBrains Mono',monospace;font-size:.63rem;font-weight:700;color:#2e2e2e;display:block;}
.aura-card.rare .aura-odds{color:#3e3e3e;}
.aura-dup{position:absolute;top:9px;right:10px;font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;color:#2e2e2e;background:#0d0d0d;border:1px solid #1a1a1a;border-radius:4px;padding:1px 5px;}

.empty{padding:32px 0;text-align:center;font-size:.8rem;font-weight:600;color:#2a2a2a;text-transform:uppercase;letter-spacing:.08em;}

.footer{padding-top:28px;border-top:1px solid #181818;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.footer-txt{font-size:.65rem;font-weight:700;color:#222;text-transform:uppercase;letter-spacing:.08em;}

@media(max-width:560px){
  .page{padding:32px 16px 60px;}
  .stats{grid-template-columns:1fr;}
  .best-card{flex-direction:column;gap:10px;}
  .best-right{text-align:left;}
  .name{font-size:1.6rem;}
}
</style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <div class="loader-txt">Connecting to Firebase...</div>
</div>

<div class="page">
  <div class="header">
    <img class="avatar" id="avatar" src="" alt="">
    <div>
      <div class="name">inhumanintelligence</div>
      <div class="header-meta">
        <div class="pill">Aura — <b id="val-equipped">—</b></div>
        <div class="pill">Biome — <b id="val-biome">—</b></div>
        <div class="live-tag">
          <div class="live-dot" id="live-dot"></div>
          <span id="live-txt">Connecting</span>
        </div>
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Total Rolls</div>
      <div class="stat-value" id="stat-rolls">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Auras Collected</div>
      <div class="stat-value" id="stat-collected">—</div>
    </div>
  </div>

  <div class="best-card" id="best-card" style="display:none;">
    <div>
      <div class="best-eyebrow">Best Roll Today</div>
      <div class="best-name" id="best-name">—</div>
      <div class="best-odds" id="best-odds">—</div>
    </div>
    <div class="best-right">
      <div class="best-time-label">Rolled at</div>
      <div class="best-time-val" id="best-time">—</div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-head">
      <div class="sec-title">Today's Notable Rolls</div>
      <div class="sec-badge" id="roll-count"></div>
    </div>
    <div class="roll-list" id="roll-list"><div class="empty">Loading...</div></div>
  </div>

  <div class="sec">
    <div class="sec-head">
      <div class="sec-title">Aura Collection</div>
      <div class="sec-badge" id="aura-count"></div>
    </div>
    <div class="aura-grid" id="aura-grid"><div class="empty" style="grid-column:1/-1">Loading...</div></div>
  </div>

  <div class="footer">
    <div class="footer-txt">inhumanintelligence</div>
    <div class="footer-txt" id="footer-time">—</div>
  </div>
</div>

<script type="module">
import { initializeApp }            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey:            "AIzaSyC2umvpkas9QCC1PHrWXjk6g67i7Wyr11A",
  authDomain:        "website-9f859.firebaseapp.com",
  databaseURL:       "https://website-9f859-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "website-9f859",
  storageBucket:     "website-9f859.firebasestorage.app",
  messagingSenderId: "756244892931",
  appId:             "1:756244892931:web:20a4656797e7da82936d36",
  measurementId:     "G-D816NNYLGZ"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

const PLAYER_ID            = "8499836409";
const ROBLOX_ID_FOR_AVATAR = "8499836409";

// ── Avatar ───────────────────────────────────────────────────
fetch(`https://thumbnails.roproxy.com/v1/users/avatar?userIds=${ROBLOX_ID_FOR_AVATAR}&size=420x420&format=Png&isCircular=false`)
  .then(r => r.json())
  .then(res => {
    if (res.data?.[0]?.state === "Completed")
      document.getElementById('avatar').src = res.data[0].imageUrl;
  })
  .catch(() => {});

// ── Helpers ──────────────────────────────────────────────────
function set(id, v) {
  const e = document.getElementById(id);
  if (e) e.textContent = v;
}

function fmt(n) {
  return Number(n).toLocaleString();
}

// FIX 1: handles both "1 in 1,000,000" strings AND plain numbers
function parseOddsNum(val) {
  if (val === null || val === undefined) return 0;
  if (typeof val === 'number') return val;
  const cleaned = String(val).replace(/,/g, '');
  const m = cleaned.match(/(\d+)\s*$/);
  return m ? parseInt(m[1], 10) : 0;
}

// ── Loader ───────────────────────────────────────────────────
// FIX 2: loader always dismisses — on success, error, or after 6s max
let loaderDismissed = false;
function dismissLoader() {
  if (loaderDismissed) return;
  loaderDismissed = true;
  const ldr = document.getElementById('loader');
  ldr.classList.add('gone');
  setTimeout(() => ldr.remove(), 600);
}
setTimeout(dismissLoader, 6000);

// ── Render auras ──────────────────────────────────────────────
function renderAuras(auras) {
  const grid = document.getElementById('aura-grid');

  // FIX 3: always update stat-collected, even when auras is empty
  const total = (auras || []).reduce((s, a) => s + (a.count || 1), 0);
  set('stat-collected', fmt(total));

  if (!auras || !auras.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">No auras yet</div>';
    set('aura-count', '0 auras');
    return;
  }

  auras.sort((a, b) => parseOddsNum(b.odds) - parseOddsNum(a.odds));
  set('aura-count', auras.length + ' auras');
  grid.innerHTML = '';

  auras.forEach(a => {
    const c = document.createElement('div');
    const isRare = parseOddsNum(a.odds) >= 500000;
    c.className = 'aura-card' + (isRare ? ' rare' : '');
    c.innerHTML = `
      ${(a.count || 1) > 1 ? `<span class="aura-dup">×${a.count}</span>` : ''}
      <div class="aura-name">${a.name || 'Unknown'}</div>
      <span class="aura-odds">${String(a.odds || '').toLowerCase()}</span>
    `;
    grid.appendChild(c);
  });
}

// ── Render today's rolls ──────────────────────────────────────
function renderRolls(history) {
  const list = document.getElementById('roll-list');
  const todayStart = new Date();
  todayStart.setHours(0, 0, 0, 0);
  const todayTs = todayStart.getTime() / 1000;

  const todayNotable = (history || []).filter(r =>
    (r.timestamp || 0) >= todayTs && parseOddsNum(r.odds) >= 10000
  );

  if (!todayNotable.length) {
    list.innerHTML = '<div class="empty">No notable rolls today yet</div>';
    document.getElementById('best-card').style.display = 'none';
    set('roll-count', '0 rolls');
    return;
  }

  const sorted = [...todayNotable].sort((a, b) => parseOddsNum(b.odds) - parseOddsNum(a.odds));
  const best = sorted[0];
  document.getElementById('best-card').style.display = 'flex';
  set('best-name', best.name || 'Unknown');
  set('best-odds', best.odds || '');
  set('best-time', best.timestamp
    ? new Date(best.timestamp * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    : '—');

  const byTime = [...todayNotable].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
  set('roll-count', byTime.length + ' rolls');
  list.innerHTML = '';

  byTime.forEach(r => {
    const row = document.createElement('div');
    const hl = parseOddsNum(r.odds) >= 100000;
    row.className = 'roll-row' + (hl ? ' hl' : '');
    const t = r.timestamp
      ? new Date(r.timestamp * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      : '—';
    row.innerHTML = `
      <div class="rn">${r.name || 'Unknown'}</div>
      <div class="ro">${r.odds || ''}</div>
      <div class="rt">${t}</div>
    `;
    list.appendChild(row);
  });
}

// ── Firebase Realtime listener (instant updates, no polling) ──
const playerRef = ref(db, `players/${PLAYER_ID}`);

onValue(playerRef, (snapshot) => {
  dismissLoader();

  const d = snapshot.val();

  if (!d) {
    document.getElementById('live-dot').classList.remove('on');
    set('live-txt', 'No data yet');
    set('stat-rolls', '0');
    set('stat-collected', '0');
    set('val-equipped', 'None');
    set('val-biome', 'Normal');
    renderAuras([]);
    renderRolls([]);
    return;
  }

  const online = (Date.now() / 1000) - (d.last_updated || 0) < 30;
  const dot = document.getElementById('live-dot');
  if (online) { dot.classList.add('on'); set('live-txt', 'Live'); }
  else        { dot.classList.remove('on'); set('live-txt', 'Offline'); }

  set('stat-rolls', fmt(d.rolls || 0));
  set('val-equipped', d.equipped_aura || 'None');
  set('val-biome', d.biome || 'Normal');

  // Lua may send these as JSON strings — parse if needed
  let history = d.roll_history || [];
  if (typeof history === 'string') { try { history = JSON.parse(history); } catch { history = []; } }

  let auras = d.auras || [];
  if (typeof auras === 'string') { try { auras = JSON.parse(auras); } catch { auras = []; } }

  renderAuras(auras);
  renderRolls(history);

  set('footer-time', 'updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));

}, (error) => {
  // Called if Firebase connection fails (e.g. rules block access)
  dismissLoader();
  document.getElementById('live-dot').classList.remove('on');
  set('live-txt', 'Offline');
  console.error('Firebase error:', error);
});
</script>
</body>
</html>
