<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OSINTCLAW</title>
<meta name="description" content="OSINTCLAW searches publicly available information from legal sources.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #000;
    color: #fff;
    font-family: Inter, sans-serif;
    display: flex;
    flex-direction: column;
}

main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
}

.hero {
    width: 100%;
    max-width: 1100px;
    text-align: center;
    animation: fade 0.6s ease;
}

@keyframes fade {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo {
    width: 300px;
    max-width: 80%;
    margin-bottom: 50px;
}

.title {
    font-family: "Pixelify Sans", sans-serif;
    font-size: 42px;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

.subtitle {
    color: #888;
    font-size: 16px;
    margin-bottom: 45px;
}

.search-container {
    display: flex;
    gap: 10px;
    width: 100%;
}

select,
input,
button {

    height: 55px;
    background: #000;
    color: white;
    border: 1px solid #333;
    font-size: 15px;
    transition: 150ms ease;
}

select {
    width: 220px;
    padding: 0 15px;
}

input {
    flex: 1;
    padding: 0 20px;
}

button {
    width: 180px;
    cursor: pointer;
    font-family: "Pixelify Sans", sans-serif;
    font-size: 18px;
}

select:hover,
input:hover,
button:hover {

    border-color: #777;

}

select:focus,
input:focus,
button:focus {

    outline: none;
    border-color: white;

}

button:hover {

    background: #111;

}

.disclaimer {

    text-align: center;
    padding: 30px 20px;
    color: #666;
    font-size: 13px;
    border-top: 1px solid #1c1c1c;

}

@media(max-width:800px){

    .title {
        font-size: 32px;
    }

    .search-container {
        flex-direction: column;
    }

    select,
    input,
    button {

        width: 100%;

    }

    .logo {

        width: 220px;

    }

}

</style>

</head>


<body>


<main>

<section class="hero">

<img 
src="images/osintclaw-logo.png"
alt="OSINTCLAW Logo"
class="logo"
>


<h1 class="title">
OSINTCLAW
</h1>


<p class="subtitle">
Search Public Intelligence
</p>


<div class="search-container">


<select aria-label="Search type">

<option>Username</option>
<option>Email</option>
<option>Domain</option>
<option>IP Address</option>
<option>Phone Number</option>
<option>Hash</option>
<option>Cryptocurrency Address</option>
<option>URL</option>

</select>


<input
type="text"
placeholder="enter search query..."
aria-label="Search query"
>


<button>
SEARCH
</button>


</div>


</section>

</main>


<footer class="disclaimer">

OSINTCLAW only searches publicly available information from legal sources.
<br>
Users are responsible for complying with local laws and platform terms of service.

</footer>


</body>
</html>
