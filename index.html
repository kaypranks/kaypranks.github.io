<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>osintclaw</title>

<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Pixelify Sans", monospace !important;
    font-weight: 400;
}

body {
    min-height: 100vh;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
}

main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
}

.hero {
    width: 100%;
    max-width: 1100px;
    text-align: center;
}

.logo {
    width: 320px;
    max-width: 85%;
    height: auto;
    margin-bottom: 70px;
    image-rendering: pixelated;
    display: block;
    margin-left: auto;
    margin-right: auto;
}

.subtitle {
    color: #777;
    font-size: 18px;
    margin-bottom: 40px;
}

.search-container {
    display: flex;
    gap: 5px;
    width: 100%;
}

.custom-select {
    position: relative;
    width: 220px;
}

.select-button {
    width: 100%;
    height: 55px;
    background: #000;
    color: #fff;
    border: 1px solid #333;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 15px;
}

.options {
    position: absolute;
    top: 60px;
    left: 0;
    width: 100%;
    background: #000;
    border: 1px solid #333;
    display: none;
    z-index: 10;
}

.options div {
    padding: 15px;
    cursor: pointer;
    text-align: left;
    font-size: 16px;
}

.options div:hover {
    background: #111;
}

.custom-select.active .options {
    display: block;
}

input,
.search-button {
    height: 55px;
    background: #000;
    color: #fff;
    border: 1px solid #333;
    font-size: 16px;
}

input {
    flex: 1;
    padding: 0 20px;
}

input::placeholder {
    color: #555;
}

.search-button {
    width: 220px;
    cursor: pointer;
    font-size: 18px;
}

button:hover,
input:hover {
    border-color: #777;
}

button:focus,
input:focus {
    outline: none;
    border-color: #fff;
}

.search-button:hover {
    background: #111;
}

.disclaimer {
    text-align: center;
    padding: 30px 20px;
    color: #555;
    font-size: 13px;
    border-top: 1px solid #1c1c1c;
}

@media(max-width:800px){

    .search-container {
        flex-direction: column;
    }

    .custom-select,
    input,
    .search-button {
        width: 100%;
    }

}

</style>

</head>


<body>


<main>

<section class="hero">


<img
src="https://kaypranks.github.io/osintclaw-logo.png"
alt="osintclaw logo"
class="logo"
>


<div class="search-container">


<div class="custom-select">

<button class="select-button">
username
<span>▼</span>
</button>


<div class="options">

<div>username</div>
<div>email</div>
<div>domain</div>
<div>ip address</div>
<div>phone number</div>

</div>

</div>


<input
type="text"
placeholder="input search query..."
>


<button class="search-button">
search
</button>


</div>


</section>

</main>


<footer class="disclaimer">

osintclaw only searches publicly available information from legal sources.
<br>
users are responsible for complying with local laws and platform terms of service.

</footer>


<script>

const select = document.querySelector(".custom-select");
const button = document.querySelector(".select-button");
const options = document.querySelectorAll(".options div");


button.onclick = (e) => {
    e.stopPropagation();
    select.classList.toggle("active");
};


options.forEach(option => {

    option.onclick = () => {

        button.innerHTML = option.textContent + "<span>▼</span>";
        select.classList.remove("active");

    };

});


document.onclick = () => {

    select.classList.remove("active");

};

</script>


</body>
</html>
